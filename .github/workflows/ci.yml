name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: agent (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: install python
        run: uv python install 3.12

      - name: sync deps
        run: uv sync --all-extras --dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest

      - name: pip-audit
        # The ignored advisories are all in transitive deps that
        # coinbase-agentkit 0.7.4 (the latest release) pins below their patched
        # versions, so we cannot bump them without forking upstream:
        #   cryptography <=46.0.0  (PYSEC fixes are 46.0.5/46.0.6/46.0.7;
        #     GHSA-537c-gmf6-5ccf fix is 48.0.1, which coinbase-agentkit caps out)
        #     PYSEC-2026-36, PYSEC-2026-35, CVE-2026-26007, GHSA-537c-gmf6-5ccf
        #   pynacl <=1.6.0         (fix is 1.6.2)   CVE-2025-69277
        #   x402 ==1.0.0           (fix is 2.3.0)   GHSA-qr2g-p6q7-w82m
        #   paramiko 3.5.1         (no fix released yet)  CVE-2026-44405
        # Bumped to patched releases via constraint-dependencies in
        # agent/pyproject.toml (so NOT ignored here): starlette 1.3.1,
        # aiohttp 3.14.1, pyjwt 2.13.0, pydantic-settings 2.14.2,
        # python-multipart 0.0.32. Re-evaluate this allowlist on every
        # coinbase-agentkit bump; drop entries as upstream relaxes the pins.
        run: |
          uv export --no-emit-project --format requirements-txt --quiet -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt \
            --ignore-vuln PYSEC-2026-36 \
            --ignore-vuln PYSEC-2026-35 \
            --ignore-vuln CVE-2026-26007 \
            --ignore-vuln CVE-2025-69277 \
            --ignore-vuln GHSA-qr2g-p6q7-w82m \
            --ignore-vuln CVE-2026-44405 \
            --ignore-vuln GHSA-537c-gmf6-5ccf

  frontend:
    name: frontend (next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm run test

      - name: build
        run: npm run build

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  security:
    name: security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks scan
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          ./gitleaks detect --source . --no-banner --redact
