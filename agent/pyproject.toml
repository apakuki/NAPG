[project]
name = "napg"
version = "0.0.1"
description = "NetAssure Protocol Guardian — autonomous Protocol Service Assurance agent for Coinbase Base"
requires-python = ">=3.10"
readme = "../README.md"
authors = [
  { name = "Samuel Apakuki Nayacakalou" },
]
dependencies = [
  "anthropic>=0.109.1",
  "web3>=7.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.49.0",
  "tomli>=2.0.0 ; python_version < '3.11'",
  "coinbase-agentkit>=0.2.0",
  "cryptography>=43.0.0",
]

# Security floors for transitive deps whose own dependents (fastapi,
# coinbase-agentkit, web3) do not yet require the patched releases. Each line
# forces a version that clears CVEs pip-audit would otherwise fail on. Anything
# coinbase-agentkit 0.7.4 (the latest) hard-caps below its patched release
# cannot be bumped here without forking upstream; those stay on the CI pip-audit
# --ignore-vuln allowlist with reasons documented there. Revisit when the
# upstreams update.
[tool.uv]
constraint-dependencies = [
  "starlette>=1.3.1",
  "aiohttp>=3.14.1",
  "pyjwt>=2.13.0",
  "pydantic-settings>=2.14.2",
  "python-multipart>=0.0.31",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["napg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=napg --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
