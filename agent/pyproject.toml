[project]
name = "napg"
version = "0.0.1"
description = "NetAssure Protocol Guardian — autonomous Protocol Service Assurance agent for Coinbase Base"
requires-python = ">=3.10"
readme = "../README.md"
authors = [
  { name = "Samuel Apakuki Nayacakalou" },
]
dependencies = [
  "anthropic>=0.40.0",
  "web3>=7.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.49.0",
  "tomli>=2.0.0 ; python_version < '3.11'",
  "coinbase-agentkit>=0.2.0",
  "cryptography>=43.0.0",
]

# Security floor for starlette (transitive via fastapi): force the patched
# 1.0.1 that clears PYSEC-2026-161, which fastapi's own range does not require.
# The other flagged transitives (cryptography, pynacl, x402, paramiko) are
# pinned below their patched releases by coinbase-agentkit 0.7.4 (the latest),
# so they cannot be bumped without forking upstream; they are allowlisted in
# the CI pip-audit step instead, with the reasons documented there. Revisit
# both this constraint and that allowlist when coinbase-agentkit updates.
[tool.uv]
constraint-dependencies = [
  "starlette>=1.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["napg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=napg --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.format]
quote-style = "double"
